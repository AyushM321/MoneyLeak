name: MoneyLeak Android APK and Auto Version

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'version.json'
      - 'README.md'
      - 'UPLOAD_INSTRUCTIONS.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moneyleak-android-build
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read release version from version.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./version.json').version || '0.4'")
          VERSION=${VERSION#v}
          MAJOR=${VERSION%%.*}
          MINOR=${VERSION#*.}
          MINOR=${MINOR%%.*}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building MoneyLeak v$VERSION (versionCode $VERSION_CODE)"

      - name: Install dependencies and prepare app
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Android app version
        shell: bash
        run: |
          FILE=android/app/build.gradle
          if [ ! -f "$FILE" ]; then FILE=android/app/build.gradle.kts; fi
          if [[ "$FILE" == *.kts ]]; then
            sed -i "s/versionCode = .*/versionCode = ${{ steps.version.outputs.version_code }}/; s/versionName = .*/versionName = \"${{ steps.version.outputs.version }}\"/" "$FILE"
          else
            sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.version_code }}/; s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version }}\"/" "$FILE"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MoneyLeak-v${{ steps.version.outputs.version }}-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyLeak-v${{ steps.version.outputs.version }}-APK
          path: MoneyLeak-v${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 90
