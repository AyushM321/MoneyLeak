name: MoneyLeak Web Auto Version

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "version.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moneyleak-web-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Increment version for every app-file update
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'version.json';
          let current = { version: '0.7' };
          if (fs.existsSync(file)) {
            try { current = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
          }
          const parts = String(current.version || '0.7').replace(/^v/, '').split('.');
          const major = Number(parts[0] || 0);
          const minor = Number(parts[1] || 0) + 1;
          const version = `${major}.${minor}`;
          fs.writeFileSync(file, JSON.stringify({ version }, null, 2) + '\n');
          console.log(`MoneyLeak version: ${current.version} -> ${version}`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: auto-bump MoneyLeak version" || exit 0
          git push
