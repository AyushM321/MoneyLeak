name: Update MoneyLeak version
on:
  push:
    branches: [main]
    paths-ignore:
      - 'version.json'
      - 'README-INSTALL.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Write version number
        shell: bash
        run: |
          RUN_NO="${GITHUB_RUN_NUMBER}"
          PATCH=$((RUN_NO + 2))
          printf '{\n  "version": "0.%s"\n}\n' "$PATCH" > version.json
      - name: Commit version file
        run: |
          if git diff --quiet -- version.json; then
            echo "Version unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update app version"
          git push
